<!doctype html>
<!-- Dev-only: renders public/images/sim-card.png (custom SIM card; SimReady has no SIM asset). -->
<html>
<body style="margin:0;background:transparent">
<canvas id="c" width="1024" height="1024"></canvas>
<script type="module">
import * as THREE from 'three'
import { RoomEnvironment } from 'three/examples/jsm/environments/RoomEnvironment.js'

const canvas = document.getElementById('c')
const renderer = new THREE.WebGLRenderer({ canvas, alpha: true, antialias: true, preserveDrawingBuffer: true })
renderer.setPixelRatio(1)
renderer.setSize(1024, 1024, false)
renderer.toneMapping = THREE.NeutralToneMapping
renderer.outputColorSpace = THREE.SRGBColorSpace
const scene = new THREE.Scene()
const pmrem = new THREE.PMREMGenerator(renderer)
scene.environment = pmrem.fromScene(new RoomEnvironment(), 0.04).texture

// nano/micro SIM proportions (mm): 15 x 11 card, chamfered corner, 0.76 thick
const W = 15, H = 11, R = 0.9, C = 2.6, D = 0.76
const shape = new THREE.Shape()
shape.moveTo(-W / 2 + R, -H / 2)
shape.lineTo(W / 2 - R, -H / 2)
shape.quadraticCurveTo(W / 2, -H / 2, W / 2, -H / 2 + R)
shape.lineTo(W / 2, H / 2 - C)
shape.lineTo(W / 2 - C, H / 2)
shape.lineTo(-W / 2 + R, H / 2)
shape.quadraticCurveTo(-W / 2, H / 2, -W / 2, H / 2 - R)
shape.lineTo(-W / 2, -H / 2 + R)
shape.quadraticCurveTo(-W / 2, -H / 2, -W / 2 + R, -H / 2)
const bodyGeo = new THREE.ExtrudeGeometry(shape, { depth: D - 0.3, bevelEnabled: true, bevelThickness: 0.15, bevelSize: 0.15, bevelSegments: 4, curveSegments: 12 })
bodyGeo.translate(0, 0, -(D - 0.3) / 2)
const body = new THREE.Mesh(bodyGeo, new THREE.MeshPhysicalMaterial({ color: '#20252b', roughness: 0.42, metalness: 0.05, clearcoat: 0.8, clearcoatRoughness: 0.25 }))
scene.add(body)

// gold contact pad with ISO 7816 style contact grooves
const pc = document.createElement('canvas'); pc.width = 640; pc.height = 512
const g = pc.getContext('2d')
const grad = g.createLinearGradient(0, 0, 640, 512)
grad.addColorStop(0, '#fbe4a2'); grad.addColorStop(0.35, '#e0ae45'); grad.addColorStop(0.7, '#c18a26'); grad.addColorStop(1, '#f3d27e')
g.fillStyle = grad; g.fillRect(0, 0, 640, 512)
g.strokeStyle = '#7a5a1c'; g.lineWidth = 14; g.lineCap = 'round'; g.lineJoin = 'round'
const line = (pts) => { g.beginPath(); g.moveTo(...pts[0]); for (const p of pts.slice(1)) g.lineTo(...p); g.stroke() }
// central island
g.beginPath(); g.roundRect(240, 150, 160, 212, 40); g.stroke()
// left and right banks of 3 contacts
line([[0, 170], [240, 170]]); line([[0, 342], [240, 342]])
line([[400, 170], [640, 170]]); line([[400, 342], [640, 342]])
line([[320, 0], [320, 150]]); line([[320, 362], [320, 512]])
const padTex = new THREE.CanvasTexture(pc); padTex.colorSpace = THREE.SRGBColorSpace; padTex.anisotropy = 8
const PW = 8.0, PH = 6.4, PR = 0.9
const ps = new THREE.Shape()
ps.moveTo(-PW / 2 + PR, -PH / 2); ps.lineTo(PW / 2 - PR, -PH / 2); ps.quadraticCurveTo(PW / 2, -PH / 2, PW / 2, -PH / 2 + PR)
ps.lineTo(PW / 2, PH / 2 - PR); ps.quadraticCurveTo(PW / 2, PH / 2, PW / 2 - PR, PH / 2)
ps.lineTo(-PW / 2 + PR, PH / 2); ps.quadraticCurveTo(-PW / 2, PH / 2, -PW / 2, PH / 2 - PR)
ps.lineTo(-PW / 2, -PH / 2 + PR); ps.quadraticCurveTo(-PW / 2, -PH / 2, -PW / 2 + PR, -PH / 2)
const padGeo = new THREE.ExtrudeGeometry(ps, { depth: 0.05, bevelEnabled: true, bevelThickness: 0.02, bevelSize: 0.03, bevelSegments: 2, curveSegments: 10 })
// map the contact texture across the pad face (extrude UVs are in shape units)
padTex.repeat.set(1 / PW, 1 / PH); padTex.offset.set(0.5, 0.5)
const pad = new THREE.Mesh(padGeo, [
  new THREE.MeshStandardMaterial({ map: padTex, metalness: 0.9, roughness: 0.22 }),
  new THREE.MeshStandardMaterial({ color: '#b8862c', metalness: 1, roughness: 0.3 }),
])
pad.position.set(-2.2, -0.2, D / 2 - 0.01)
scene.add(pad)

// printed 5G mark
const tc = document.createElement('canvas'); tc.width = 256; tc.height = 256
const t = tc.getContext('2d')
t.fillStyle = 'rgba(255,255,255,0.92)'; t.font = '700 120px Helvetica, Arial, sans-serif'; t.textAlign = 'center'; t.textBaseline = 'middle'
t.fillText('5G', 128, 140)
t.fillStyle = '#76b900'; t.fillRect(70, 52, 116, 14)
const markTex = new THREE.CanvasTexture(tc); markTex.colorSpace = THREE.SRGBColorSpace
const mark = new THREE.Mesh(new THREE.PlaneGeometry(3.4, 3.4), new THREE.MeshStandardMaterial({ map: markTex, transparent: true, roughness: 0.5 }))
mark.position.set(4.6, -1.4, D / 2 + 0.005)
scene.add(mark)

const key = new THREE.DirectionalLight('#ffffff', 2.2); key.position.set(-6, 9, 14); scene.add(key)
const rim = new THREE.DirectionalLight('#dfe9ff', 1.2); rim.position.set(10, -4, 6); scene.add(rim)

const group = new THREE.Group(); scene.add(group)
for (const m of [body, pad, mark]) group.add(m)
group.rotation.set(-0.5, 0.42, 0.12)

const cam = new THREE.OrthographicCamera(-10, 10, 10, -10, 0.1, 100)
cam.position.set(0, 0, 40); cam.lookAt(0, 0, 0)
renderer.render(scene, cam)

// crop to the alpha bounding box
const src = document.createElement('canvas'); src.width = 1024; src.height = 1024
const sx = src.getContext('2d'); sx.drawImage(canvas, 0, 0)
const px = sx.getImageData(0, 0, 1024, 1024).data
let x0 = 1024, y0 = 1024, x1 = 0, y1 = 0
for (let y = 0; y < 1024; y++) for (let x = 0; x < 1024; x++) if (px[(y * 1024 + x) * 4 + 3] > 4) { if (x < x0) x0 = x; if (x > x1) x1 = x; if (y < y0) y0 = y; if (y > y1) y1 = y }
const pad2 = 8
const cw = x1 - x0 + 1 + pad2 * 2, ch = y1 - y0 + 1 + pad2 * 2
const k = 320 / cw
const out = document.createElement('canvas'); out.width = 320; out.height = Math.round(ch * k)
const ox = out.getContext('2d'); ox.imageSmoothingQuality = 'high'
ox.drawImage(src, x0 - pad2, y0 - pad2, cw, ch, 0, 0, out.width, out.height)
window.__png = out.toDataURL('image/png')
window.__size = [out.width, out.height]
</script>
</body>
</html>
